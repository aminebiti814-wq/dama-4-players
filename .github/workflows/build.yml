name: Build app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing key
        env:
          DAMA_SIGNING: ${{ secrets.DAMA_SIGNING }}
        run: |
          if [ -z "${DAMA_SIGNING:-}" ]; then
            echo "No DAMA_SIGNING secret set - building unsigned."
            exit 0
          fi
          echo "$DAMA_SIGNING" | base64 -d > "$RUNNER_TEMP/signing.env"
          set -a; . "$RUNNER_TEMP/signing.env"; set +a
          echo "::add-mask::$DAMA_KEYSTORE_PASSWORD"
          echo "::add-mask::$DAMA_KEY_PASSWORD"
          echo "$DAMA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          rm -f "$RUNNER_TEMP/signing.env"
          {
            echo "DAMA_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "DAMA_KEYSTORE_PASSWORD=$DAMA_KEYSTORE_PASSWORD"
            echo "DAMA_KEY_ALIAS=$DAMA_KEY_ALIAS"
            echo "DAMA_KEY_PASSWORD=$DAMA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing key loaded."

      - name: Build .aab and .apk
        run: gradle bundleRelease assembleRelease assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dama-4-players
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
